name: Desktop build

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter and Rust
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/flutter/bin" >> $env:GITHUB_PATH
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.1

      - name: Verify and build Rust engine
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --workspace --release --locked

      - name: Verify and build Flutter UI
        working-directory: desktop/morrow
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub

      - name: Package and verify desktop artifacts
        run: |
          python -m pip install fonttools==4.68.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_morrow.py --output dist/SHODAN_Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Get-ChildItem -LiteralPath dist -Filter '*.exe' | Select-Object -First 1
          $verification = Start-Process -FilePath $package.FullName -ArgumentList '--verify-package' -WindowStyle Hidden -Wait -PassThru
          exit $verification.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-build
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.exe
