[package]
name = "shodan-core"
version = "4.6.0-r4.1"
edition = "2021"
license = "GPL-3.0-or-later"
autobins = false

[[bin]]
name = "shodan-native"
path = "src/bin/shodan-native.rs"

[[bin]]
name = "shodan-portable"
path = "src/bin/shodan-portable.rs"

[dependencies]
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
flate2 = "=1.1.10"
crypto_box = { version = "=0.9.1", features = ["seal"] }
sha2 = "=0.10.9"
